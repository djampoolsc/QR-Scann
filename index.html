<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 12px;
        background: #f1f5f9;
        color: #0f172a;
        min-height: 100dvh;
      }
      .card {
        width: 100%;
        background: #fff;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      h3 {
        margin: 0 0 12px 0;
        font-size: 1.15rem;
        color: #0b3d91;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        font-size: 0.78rem;
        text-transform: uppercase;
        color: #475569;
      }
      input, select, button {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
        min-height: 46px;
      }
      button {
        background: #0b3d91;
        color: #fff;
        border: none;
        font-weight: bold;
        margin-top: 14px;
        cursor: pointer;
        touch-action: manipulation;
      }
      button.cam-btn { background: #0077c8; }
      button.cancel-btn { background: #64748b; }
      #reader {
        width: 100%;
        margin-top: 10px;
        display: none;
        border-radius: 8px;
        overflow: hidden;
      }
      #res {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 0.92rem;
        line-height: 1.35;
        display: none;
        word-break: break-word;
        background: #dcfce7;
        color: #166534;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 999;
      }
      .modal-box {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      }
      .dato-row {
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }
      .dato-lbl {
        font-size: 0.72rem;
        font-weight: bold;
        text-transform: uppercase;
        color: #64748b;
      }
      .dato-val {
        font-size: 1.05rem;
        font-weight: bold;
        color: #0f172a;
        margin-top: 2px;
        word-break: break-word;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      .modal-actions button {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Garita — Escáner Directo v1.0</h3>

      <label for="guardia">Guardia</label>
      <input id="guardia" type="text" placeholder="Nombre del guardia">

      <label for="mov">Movimiento</label>
      <select id="mov">
        <option value="INGRESO">INGRESO</option>
        <option value="SALIDA">SALIDA</option>
      </select>

      <button type="button" class="cam-btn" onclick="iniciarCamara()">Abrir cámara</button>
      <div id="reader"></div>

      <label for="qr">Código QR</label>
      <input id="qr" type="text" placeholder="PLH-...">

      <button type="button" onclick="abrirModalVerificacion()">Verificar y Registrar</button>
      <div id="res"></div>
    </div>

    <div id="modalVerif" class="modal-backdrop">
      <div class="modal-box">
        <h3>Verificar con DNI físico</h3>
        <div class="dato-row">
          <div class="dato-lbl">Nombre completo</div>
          <div id="mNombre" class="dato-val">-</div>
        </div>
        <div class="dato-row">
          <div class="dato-lbl">DNI</div>
          <div id="mDni" class="dato-val">-</div>
        </div>
        <div class="dato-row">
          <div class="dato-lbl">Propiedad / Estado</div>
          <div id="mExtra" class="dato-val">-</div>
        </div>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" onclick="cerrarModal()">Cancelar</button>
          <button type="button" onclick="confirmarYEnviar()">Confirmar y Registrar</button>
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'https://script.google.com/macros/s/AKfycbyF2fh8wCc47d_a-KKxjN3sgx2UigaJ7F8F3yosUBAUPDgSoEL4QbMfCmHJLXJmTPC7/exec';
      let qrScanner = null;
      let camaraAbierta = false;

      async function iniciarCamara() {
        const box = document.getElementById('reader');
        if (camaraAbierta && qrScanner) {
          try {
            await qrScanner.stop();
            qrScanner.clear();
          } catch (_) {}
          camaraAbierta = false;
          box.style.display = 'none';
          return;
        }

        box.style.display = 'block';
        if (!qrScanner) {
          qrScanner = new Html5Qrcode('reader');
        }

        qrScanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          async (txt) => {
            const codigo = String(txt || '').trim();
            if (!codigo) return;
            document.getElementById('qr').value = codigo;
            try {
              await qrScanner.stop();
              qrScanner.clear();
            } catch (_) {}
            camaraAbierta = false;
            box.style.display = 'none';
            abrirModalVerificacion();
          },
          () => {}
        ).then(() => {
          camaraAbierta = true;
        }).catch((e) => {
          camaraAbierta = false;
          box.style.display = 'none';
          mostrarEstado('Error cámara: ' + e, false);
        });
      }

      function abrirModalVerificacion() {
        const qr = document.getElementById('qr').value.trim();
        if (!qr) return;

        const partes = qr.split('|');
        document.getElementById('mNombre').innerText = 'Consultando...';
        document.getElementById('mDni').innerText = partes[1] || 'Consultando...';
        document.getElementById('mExtra').innerText = 'ID: ' + (partes[0] || qr);
        document.getElementById('modalVerif').style.display = 'flex';

        const cbName = 'cbPase_' + Date.now();
        window[cbName] = function (info) {
          try { delete window[cbName]; } catch (_) {}
          if (scriptTag && scriptTag.parentNode) {
            scriptTag.parentNode.removeChild(scriptTag);
          }
          if (info && info.encontrado) {
            document.getElementById('mNombre').innerText = info.trabajador || 'SIN NOMBRE';
            document.getElementById('mDni').innerText = info.dni || 'SIN DNI';
            document.getElementById('mExtra').innerText =
              (info.propiedad || '-') + ' • ' + (info.resultado || info.estadoPase || '');
          } else {
            document.getElementById('mNombre').innerText = 'NO REGISTRADO EN HOJA';
            document.getElementById('mDni').innerText = partes[1] || '-';
            document.getElementById('mExtra').innerText = (info && info.resultado) || 'DENEGADO_NO_EXISTE';
          }
        };

        const scriptTag = document.createElement('script');
        scriptTag.src = API_URL + '?action=consultar&qr=' + encodeURIComponent(qr) + '&callback=' + cbName;
        scriptTag.onerror = function () {
          try { delete window[cbName]; } catch (_) {}
          document.getElementById('mNombre').innerText = partes[0] || qr;
          document.getElementById('mDni').innerText = partes[1] || 'Revisar código QR';
          document.getElementById('mExtra').innerText = 'Verifique con DNI físico antes de confirmar';
        };
        document.body.appendChild(scriptTag);
      }

      function cerrarModal() {
        document.getElementById('modalVerif').style.display = 'none';
      }

      async function confirmarYEnviar() {
        const qr = document.getElementById('qr').value.trim();
        const guardia = document.getElementById('guardia').value.trim();
        const movimiento = document.getElementById('mov').value;
        cerrarModal();
        if (!qr) return;

        try {
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ qr, movimiento, guardia })
          });
          mostrarEstado(
            'Enviado (' + movimiento + '): ' + qr + '. Verifique en Bitacora_Garita / Autorizaciones_QR.',
            true
          );
          document.getElementById('qr').value = '';
        } catch (err) {
          mostrarEstado('Error de red: ' + err.message, false);
        }
      }

      function mostrarEstado(texto, ok) {
        const box = document.getElementById('res');
        box.style.display = 'block';
        box.style.background = ok ? '#dcfce7' : '#fee2e2';
        box.style.color = ok ? '#166534' : '#991b1b';
        box.innerText = texto;
      }
    </script>
  </body>
</html>
