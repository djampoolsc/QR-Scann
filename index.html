<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; background: #f1f5f9; color: #0f172a; }
      .card { max-width: 480px; margin: auto; background: #fff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
      label { display: block; margin-top: 8px; font-weight: bold; font-size: 12px; }
      input, select, button { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; }
      button { background: #0b3d91; color: #fff; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
      #reader { width: 100%; margin-top: 8px; display: none; }
      #res { margin-top: 10px; padding: 10px; border-radius: 6px; font-weight: bold; display: none; background: #dcfce7; color: #166534; }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Garita — Escáner Directo</h3>
      <label>Guardia</label>
      <input id="guardia" placeholder="Nombre del guardia">
      <label>Movimiento</label>
      <select id="mov">
        <option value="INGRESO">INGRESO</option>
        <option value="SALIDA">SALIDA</option>
      </select>
      <button type="button" onclick="iniciarCamara()">Abrir cámara</button>
      <div id="reader"></div>
      <label>Código QR</label>
      <input id="qr" placeholder="PLH-...">
      <button type="button" onclick="enviar()">Registrar</button>
      <div id="res"></div>
    </div>
    <script>
      let qrScanner = null;

      function iniciarCamara() {
        const box = document.getElementById('reader');
        box.style.display = 'block';
        qrScanner = new Html5Qrcode('reader');
        qrScanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (txt) => {
            document.getElementById('qr').value = txt;
            qrScanner.stop().then(() => {
              qrScanner.clear();
              box.style.display = 'none';
              enviar();
            });
          },
          () => {}
        ).catch((e) => {
          const boxRes = document.getElementById('res');
          boxRes.style.display = 'block';
          boxRes.style.background = '#fee2e2';
          boxRes.style.color = '#991b1b';
          boxRes.innerText = 'Error cámara: ' + e;
        });
      }

      async function enviar() {
        const url = 'https://script.google.com/macros/s/AKfycbyF2fh8wCc47d_a-KKxjN3sgx2UigaJ7F8F3yosUBAUPDgSoEL4QbMfCmHJLXJmTPC7/exec';
        const qr = document.getElementById('qr').value.trim();
        const guardia = document.getElementById('guardia').value.trim();
        const movimiento = document.getElementById('mov').value;
        const box = document.getElementById('res');

        if (!url || !qr) return;

        try {
          await fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ qr, movimiento, guardia })
          });
          box.style.display = 'block';
          box.style.background = '#dcfce7';
          box.style.color = '#166534';
          box.innerText = 'Enviado (' + movimiento + '): ' + qr + '. Verifique en la hoja Bitacora_Garita / Autorizaciones_QR.';
          document.getElementById('qr').value = '';
        } catch (err) {
          box.style.display = 'block';
          box.style.background = '#fee2e2';
          box.style.color = '#991b1b';
          box.innerText = 'Error de red: ' + err.message;
        }
      }
    </script>
  </body>
</html>
